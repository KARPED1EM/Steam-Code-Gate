[project]
name = "steam-code-gate"
version = "0.1.0"
description = "Used to display email verification codes or TOTP codes for Steam accounts on a web page"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]
