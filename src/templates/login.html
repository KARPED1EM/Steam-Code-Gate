{% extends "base.html" %}

{% block title %}登录 - Steam Code Gate{% endblock %}

{% block content %}
<div class="login-container glass-card">
    <h1>Steam Code Gate</h1>
    <p class="subtitle">Steam 验证码托管服务</p>

    <div id="error-message" class="hidden"></div>

    <div class="login-tabs">
        <button class="tab-btn active" data-tab="guest">访客登录</button>
        <button class="tab-btn" data-tab="admin">管理员登录</button>
    </div>

    <div class="tab-content" id="guest-tab">
        <form id="guest-form">
            <div class="form-group">
                <label for="guest-passphrase">访问口令</label>
                <input type="password" id="guest-passphrase" name="passphrase" placeholder="请输入访问口令" required maxlength="128" autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="guest-submit-btn">
                登录
            </button>
        </form>
    </div>

    <div class="tab-content hidden" id="admin-tab">
        <form id="admin-form">
            <div class="form-group">
                <label for="admin-username">用户名</label>
                <input type="text" id="admin-username" name="username" placeholder="请输入用户名" required minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label for="admin-password">密码</label>
                <input type="password" id="admin-password" name="password" placeholder="请输入密码" required minlength="6" maxlength="128">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="admin-submit-btn">
                登录
            </button>
        </form>
    </div>
</div>

<script>
// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.add('hidden');
        });

        document.getElementById(`${tab}-tab`).classList.remove('hidden');
        hideError();

        // Focus on first input
        const firstInput = document.querySelector(`#${tab}-tab input`);
        if (firstInput) firstInput.focus();
    });
});

function showError(message) {
    const errorDiv = document.getElementById('error-message');
    errorDiv.textContent = message;
    errorDiv.className = 'alert alert-error';
    errorDiv.style.display = 'block';
}

function hideError() {
    const errorDiv = document.getElementById('error-message');
    errorDiv.style.display = 'none';
}

function setButtonLoading(button, loading) {
    if (loading) {
        button.disabled = true;
        button.dataset.originalText = button.textContent;
        button.innerHTML = '<span class="loading"></span> 登录中...';
    } else {
        button.disabled = false;
        button.textContent = button.dataset.originalText || '登录';
    }
}

function getLengthHint(input) {
    const minLength = input.minLength > 0 ? input.minLength : null;
    const maxLength = input.maxLength > 0 ? input.maxLength : null;
    if (minLength && maxLength) {
        return `（${minLength}-${maxLength} 个字符）`;
    }
    if (minLength) {
        return `（至少 ${minLength} 个字符）`;
    }
    if (maxLength) {
        return `（最多 ${maxLength} 个字符）`;
    }
    return '';
}

function getValidationMessage(input, label) {
    const validity = input.validity;
    if (validity.valueMissing) {
        return `请输入${label}${getLengthHint(input)}`;
    }
    if (validity.tooShort) {
        return `${label}至少需要 ${input.minLength} 个字符`;
    }
    if (validity.tooLong) {
        return `${label}不能超过 ${input.maxLength} 个字符`;
    }
    return '';
}

function prepareFormValidation(form, fields) {
    fields.forEach(({ input, label }) => {
        input.setCustomValidity('');
        const message = getValidationMessage(input, label);
        if (message) {
            input.setCustomValidity(message);
        }
    });

    if (!form.checkValidity()) {
        form.reportValidity();
        return false;
    }
    return true;
}

function attachFieldValidation(fields) {
    fields.forEach(({ input, label }) => {
        input.addEventListener('input', () => input.setCustomValidity(''));
        input.addEventListener('invalid', () => {
            const message = getValidationMessage(input, label);
            if (message) {
                input.setCustomValidity(message);
            }
        });
    });
}

const guestFormFields = [
    { input: document.getElementById('guest-passphrase'), label: '访问口令' }
];

const adminFormFields = [
    { input: document.getElementById('admin-username'), label: '用户名' },
    { input: document.getElementById('admin-password'), label: '密码' }
];

attachFieldValidation(guestFormFields);
attachFieldValidation(adminFormFields);

// Guest login
document.getElementById('guest-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    if (!prepareFormValidation(e.target, guestFormFields)) {
        return;
    }

    const submitBtn = document.getElementById('guest-submit-btn');
    setButtonLoading(submitBtn, true);

    const formData = new FormData(e.target);

    try {
        const response = await fetch('/login/guest', {
            method: 'POST',
            body: formData
        });

        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            window.location.href = '/home';
        } else {
            const data = await response.json();
            showError(data.detail || '登录失败，请检查口令');
        }
    } catch (error) {
        showError('网络错误，请稍后重试');
    } finally {
        setButtonLoading(submitBtn, false);
    }
});

// Admin login
document.getElementById('admin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    if (!prepareFormValidation(e.target, adminFormFields)) {
        return;
    }

    const submitBtn = document.getElementById('admin-submit-btn');
    setButtonLoading(submitBtn, true);

    const formData = new FormData(e.target);

    try {
        const response = await fetch('/login/admin', {
            method: 'POST',
            body: formData
        });

        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            window.location.href = '/admin';
        } else {
            const data = await response.json();
            showError(data.detail || '用户名或密码错误');
        }
    } catch (error) {
        showError('网络错误，请稍后重试');
    } finally {
        setButtonLoading(submitBtn, false);
    }
});
</script>
{% endblock %}
